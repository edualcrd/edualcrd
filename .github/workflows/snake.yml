name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=dodgerblue&color_dots=#ebedf0,#c6e2ff,#79c0ff,#58a6ff,#1f6feb
            dist/github-snake-dark.svg?palette=github-dark&color_snake=dodgerblue&color_dots=#161b22,#0c2d6b,#1f6feb,#58a6ff,#a5d6ff

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
