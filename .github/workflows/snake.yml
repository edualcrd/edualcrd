name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=%2358a6ff&color_dots=%23ebedf0,%23c6e2ff,%2379c0ff,%2358a6ff,%231f6feb
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%2358a6ff&color_dots=%23161b22,%230c2d6b,%231f6feb,%2358a6ff,%23a5d6ff

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
